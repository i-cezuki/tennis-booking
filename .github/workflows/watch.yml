# Manual debug-only workflow. Production monitoring runs on AWS Lambda +
# EventBridge Scheduler (see docs/superpowers/specs/2026-08-29-lambda-migration-design.md)
# using state stored in S3, not the state.json file in this repo. This
# workflow's state.json is a frozen snapshot from before that cutover and is
# NOT kept in sync with production -- running this manually may re-notify
# Discord for openings the Lambda already reported, since it diffs against
# this stale baseline. It no longer commits state.json back to the repo.
name: Watch Komaba tennis court availability

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run watcher
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m src.main

      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshot
          path: failure.png
          if-no-files-found: ignore
